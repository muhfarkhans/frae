name: Deploy Frae to VPS

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: frae-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script_stop: true
          script: |
            set -e

            cd ${{ secrets.VPS_PROJECT_PATH }}

            echo "Restore deploy user ownership before git reset..."
            sudo -n chown -R "$(id -u):$(id -g)" apps/api/storage apps/api/bootstrap/cache 2>/dev/null || true
            docker compose exec -T --user root api chown -R "$(id -u):$(id -g)" storage bootstrap/cache 2>/dev/null || true

            echo "Reset code to latest master..."
            git fetch origin master
            git reset --hard origin/master

            if [ ! -f .env ]; then
              echo "Missing root .env on VPS. Create it from .env.example and fill POSTGRES_PASSWORD/MINIO_ROOT_PASSWORD."
              exit 1
            fi

            echo "Validate Docker Compose configuration..."
            docker compose config --quiet

            echo "Build containers..."
            docker compose build

            echo "Start containers..."
            docker compose up -d

            echo "Install Laravel dependencies..."
            docker compose exec -T api composer install --no-dev --optimize-autoloader

            echo "Clear Laravel cache before database commands..."
            docker compose exec -T api php artisan config:clear
            docker compose exec -T api php artisan route:clear
            docker compose exec -T api php artisan view:clear

            echo "Run Laravel migrations..."
            docker compose exec -T api php artisan migrate --force

            echo "Refresh Laravel cache..."
            docker compose exec -T api php artisan config:cache
            docker compose exec -T api php artisan route:cache
            docker compose exec -T api php artisan view:cache

            echo "Fix writable Laravel directories..."
            docker compose exec -T --user root api sh -lc "mkdir -p storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs bootstrap/cache && chmod -R ug+rwX storage bootstrap/cache"

            echo "Restart application services..."
            docker compose restart api nginx web

            echo "Clean unused Docker images..."
            docker image prune -f

            echo "Deployment finished."
