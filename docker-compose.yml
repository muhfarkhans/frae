services:
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: erp_web
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://frae-api.cojimozy.com/api}
      API_INTERNAL_URL: ${API_INTERNAL_URL:-https://frae-api.cojimozy.com/api}
    depends_on:
      - nginx
    networks:
      - erp_network

  api:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: erp_api
    working_dir: /var/www/html
    volumes:
      - ./apps/api:/var/www/html
    depends_on:
      - postgres
      - redis
    environment:
      APP_URL: ${APP_URL:-https://frae-api.cojimozy.com}
      FRONTEND_URL: ${FRONTEND_URL:-https://frae.cojimozy.com}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://frae.cojimozy.com}
      SANCTUM_STATEFUL_DOMAINS: ${SANCTUM_STATEFUL_DOMAINS:-frae.cojimozy.com}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:?Set POSTGRES_DB in root .env}
      DB_USERNAME: ${POSTGRES_USER:?Set POSTGRES_USER in root .env}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in root .env}
      REDIS_HOST: redis
    networks:
      - erp_network

  nginx:
    image: nginx:alpine
    container_name: erp_nginx
    ports:
      - "8080:80"
    volumes:
      - ./apps/api:/var/www/html
      - ./docker/nginx/api.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - api
    networks:
      - erp_network

  postgres:
    image: postgres:16-alpine
    container_name: erp_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in root .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in root .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in root .env}
    volumes:
      - erp_postgres_data:/var/lib/postgresql/data
    networks:
      - erp_network

  redis:
    image: redis:7-alpine
    container_name: erp_redis
    ports:
      - "6379:6379"
    networks:
      - erp_network

  minio:
    image: minio/minio:latest
    container_name: erp_minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in root .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in root .env}
    volumes:
      - erp_minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - erp_network

volumes:
  erp_postgres_data:
  erp_minio_data:

networks:
  erp_network:
    driver: bridge
